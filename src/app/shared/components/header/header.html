<header class="topbar">
  <a class="topbar__brand" [routerLink]="loggedIn() ? '/dashboard' : '/login'"
    ><span class="topbar__brand-mark">◉</span> WePlanet</a
  >

  @if (loggedIn()) {
    <div class="topbar__actions">
      <button class="topbar__icon-button" aria-label="Notificaciones">♧</button>
      <span class="topbar__badge">2</span>
      <span class="topbar__avatar">{{ initials }}</span>
      <strong class="topbar__user-name">{{ user()?.name }} {{ user()?.surname }}</strong>
      <button class="btn btn--outline btn--small" (click)="logout()">Cerrar sesión</button>
    </div>
  } @else {
    <nav class="topbar__actions">
      <a class="topbar__link" routerLink="/login">Iniciar sesión</a>
      <a class="btn btn--small" routerLink="/register">Registrarse</a>
    </nav>
  }
</header>
